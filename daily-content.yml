name: Daily AI Content Run

on:
  schedule:
    - cron: "30 3 * * *"   # runs at 03:30 UTC = 9:00 AM IST, every day
  workflow_dispatch: {}    # lets you also trigger it manually from the GitHub Actions tab

jobs:
  run-agents:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run the content agents
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ADMIN_API_URL: ${{ secrets.ADMIN_API_URL }}
          ADMIN_AGENT_KEY: ${{ secrets.ADMIN_AGENT_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          BUSINESS_CONTEXT: ${{ secrets.BUSINESS_CONTEXT }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py
